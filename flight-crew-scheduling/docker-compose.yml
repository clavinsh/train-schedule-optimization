services:
  rolling-stock-optimizer:
    build: .
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_LOG_LEVEL=INFO
      - QUARKUS_HTTP_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
